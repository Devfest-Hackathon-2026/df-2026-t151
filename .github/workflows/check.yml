name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
    contents: read
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run format:check
            - run: npm test
            - run: npm run build
            - run: npm run typecheck
